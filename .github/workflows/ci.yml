name: CI — Backend, Frontend & Security Hygiene

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api-test:
    name: Spring Boot API Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dat_commerce_test
          POSTGRES_USER: dat_commerce
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dat_commerce -d dat_commerce_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      SPRING_PROFILES_ACTIVE: test
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_DB: dat_commerce_test
      TEST_POSTGRES_USER: dat_commerce
      TEST_POSTGRES_PASSWORD: ci_postgres_password
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Maven Test Suite
        working-directory: services/api
        run: mvn -B test

  web-verify:
    name: Next.js Typecheck, Lint, Unit Tests & Bundle Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: ESLint
        working-directory: apps/web
        run: npm run lint
      - name: Vitest unit & contract tests
        working-directory: apps/web
        run: npm run test
      - name: Next.js production build
        working-directory: apps/web
        run: npm run build
      - name: Verify zero server secrets in client static bundle
        working-directory: apps/web
        run: |
          if grep -rnE "AI_GATEWAY_API_KEY|JWT_SECRET|POSTGRES_PASSWORD|MINIO_ROOT_PASSWORD" .next/static; then
            echo "Secret leakage detected in .next/static!"
            exit 1
          fi

  repo-hygiene:
    name: Repository & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure .env and backup dumps are never committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.dump$'; then
            echo "Tracked .env or .dump file detected!"
            exit 1
          fi
