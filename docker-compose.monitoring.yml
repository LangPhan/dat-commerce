services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    mem_limit: 256m
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - dat_commerce_prom:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - dat-commerce-net

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - dat_commerce_grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - dat-commerce-net

networks:
  dat-commerce-net:
    external: true
    name: dat-commerce_dat-commerce-net

volumes:
  dat_commerce_prom:
  dat_commerce_grafana:
