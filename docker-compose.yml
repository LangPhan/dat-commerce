name: dat-commerce

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dat_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-dat_commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
    volumes:
      - dat_commerce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dat_commerce} -d ${POSTGRES_DB:-dat_commerce}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - dat-commerce-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 192m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - dat_commerce_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dat-commerce-net

  silo:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    restart: unless-stopped
    mem_limit: 256m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-datcommerce}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_silo_password}
    volumes:
      - dat_commerce_silo:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - dat-commerce-net

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -Xms128m -Xmx512m"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dat_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-dat_commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://silo:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-datcommerce}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_silo_password}
      STORAGE_BUCKET: ${MINIO_BUCKET:-dat-commerce-media}
      STORAGE_REGION: us-east-1
      STORAGE_PUBLIC_PREFIX: /storage
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8088}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - dat-commerce-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - dat-commerce-net

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dat_commerce_caddy_data:/data
      - dat_commerce_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - dat-commerce-net

networks:
  dat-commerce-net:
    driver: bridge

volumes:
  dat_commerce_pgdata:
  dat_commerce_redis:
  dat_commerce_silo:
  dat_commerce_caddy_data:
  dat_commerce_caddy_config:
