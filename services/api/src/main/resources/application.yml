server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: dat-commerce-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:dat_commerce}
    username: ${POSTGRES_USER:dat_commerce}
    password: ${POSTGRES_PASSWORD:change_me_postgres_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-default-jwt-secret-replace-with-at-least-64-chars-123456}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
  cookie:
    name: dc_refresh_token
    secure: ${APP_COOKIE_SECURE:false}
    same-site: Lax
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8088}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:datcommerce}
    secret-key: ${STORAGE_SECRET_KEY:change_me_silo_password}
    bucket: ${STORAGE_BUCKET:dat-commerce-media}
    region: ${STORAGE_REGION:us-east-1}
    public-url-prefix: ${STORAGE_PUBLIC_PREFIX:/storage}
  ai:
    gateway-mode: ${AI_GATEWAY_MODE:mock}
    base-url: ${AI_GATEWAY_BASE_URL:}
    api-key: ${AI_GATEWAY_API_KEY:}
    default-model: ${AI_DEFAULT_MODEL:claude-sonnet-4}
    complex-task-model: ${AI_COMPLEX_TASK_MODEL:claude-sonnet-4}
    fast-task-model: ${AI_FAST_TASK_MODEL:forma-fast}
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:45}
    max-tool-rounds: ${AI_MAX_TOOL_ROUNDS:6}
    max-input-tokens: ${AI_MAX_INPUT_TOKENS:16000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:4096}
